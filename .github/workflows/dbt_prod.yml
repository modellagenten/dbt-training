# NUR ZUM LESEN: Continuous Deployment. Nach dem Merge nach main (und nachts) wird prod gebaut;
# das Manifest wird als Artefakt gespeichert und dient der CI als Vergleichsstand (Slim CI).
name: dbt Prod

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"          # täglich 04:00 UTC (GitHub plant immer in UTC!)

jobs:
  dbt-prod:
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install "dbt-core~=1.12.0" dbt-postgres
      - run: dbt deps
      - run: dbt build --target prod

      - name: Manifest als Artefakt sichern
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: prod-manifest
          path: target/manifest.json
