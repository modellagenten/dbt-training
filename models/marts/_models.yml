version: 2

models:
  - name: dim_users
    description: "Dimension Kund:innen - eine Zeile pro Nutzer:in"
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null

  - name: dim_products
    description: "Dimension Produkte - eine Zeile pro Produkt, inkl. Produktgruppe aus dem Seed"
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: category_group
        data_tests:
          - not_null

  - name: fct_order_items
    description: "Fakt Bestellpositionen - eine Zeile pro Bestellposition"
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

  - name: fct_orders
    description: "Fakt Bestellungen - eine Zeile pro Bestellung, Kennzahlen aus den Positionen"
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id

  - name: obt_order_items
    description: "One Big Table - Bestellpositionen mit Nutzer- und Produktattributen (Serving Layer)"
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null

  - name: fct_events
    description: >
      Fakt Web-Events - Microbatch-Model (Zeitfenster pro Monat, Lookback 1).
      Incremental, weil Events nur angefügt werden und die Tabelle wächst.
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
