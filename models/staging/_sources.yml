version: 2

sources:
  - name: thelook
    description: "E-Commerce-Rohdaten (thelook_ecommerce), per CSV-Import im Schema raw"
    schema: raw
    config:
      freshness:
        warn_after: {count: 1, period: day}
        error_after: {count: 3, period: day}
    tables:
      - name: users
        description: "Registrierte Kund:innen"
        config:
          loaded_at_field: created_at
      - name: products
        description: "Produktkatalog"
        config:
          freshness: null    # keine Zeitstempel -> nicht prüfen
      - name: orders
        description: "Bestellköpfe"
        config:
          loaded_at_field: created_at
      - name: order_items
        description: "Bestellpositionen"
        config:
          loaded_at_query: "select max(created_at) from {{ this }} where status <> 'Cancelled'"
      - name: inventory_items
        description: "Lagerartikel (ein Eintrag pro physischem Artikel)"
        config:
          loaded_at_field: created_at
      - name: distribution_centers
        description: "Lagerstandorte"
        config:
          freshness: null
      - name: events
        description: "Web-Events (Stichprobe mit 10.000 Zeilen)"
        config:
          loaded_at_field: created_at
