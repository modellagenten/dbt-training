unit_tests:
  - name: item_margin_is_sale_price_minus_cost
    description: "Marge = Verkaufspreis minus Kosten, auch mit negativem Ergebnis"
    model: int_order_items_enriched
    given:
      - input: ref('stg_order_items')
        rows:
          - {order_item_id: 1, order_id: 100, product_id: 10, sale_price: 10.00}
          - {order_item_id: 2, order_id: 100, product_id: 20, sale_price: 5.00}
      - input: ref('stg_orders')
        rows:
          - {order_id: 100, status: Complete}
      - input: ref('stg_products')
        rows:
          - {product_id: 10, product_cost: 4.00}
          - {product_id: 20, product_cost: 6.50}
    expect:
      format: csv
      rows: |
        order_item_id,item_margin
        1,6.00
        2,-1.50
