name: 'dbt_ecommerce'
version: '1.0.0'
profile: 'dbt_ecommerce'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_ecommerce:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts
      fct_events:
        +full_refresh: false     # Schutz vor versehentlichem Neuaufbau (auch mit --full-refresh)
