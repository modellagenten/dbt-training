name: 'dbt_ecommerce'
version: '1.0.0'
profile: 'dbt_ecommerce'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_ecommerce:
    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging']
    intermediate:
      +materialized: ephemeral
      +group: sales
      +access: private
    marts:
      +materialized: table
      +schema: marts
      +tags: ['nightly']
      +group: sales
      +grants:
        select: ['reporting']
      +persist_docs:
        relation: true
        columns: true
      fct_events:
        +full_refresh: false     # Schutz vor versehentlichem Neuaufbau (auch mit --full-refresh)

# Hooks (Übung 7): Audit-Log pro Lauf und Schema-Rechte
on-run-start:
  - "create schema if not exists {{ target.schema }}"
  - "create table if not exists {{ target.schema }}.audit_log (
      invocation_id text, target_name text, finished_at timestamp,
      nodes int, errors int)"

on-run-end:
  - "{% for schema in schemas %}grant usage on schema {{ schema }} to reporting; {% endfor %}"
  - "{{ log_run_end(results) }}"
